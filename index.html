<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii Style</title>
    <link href="./output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white">
    <video id="video-container" style="display:none;" autoplay></video>
    <canvas id="canvas-container" style="display: none;"></canvas>

    <main class="flex bg-green-950/30 min-h-screen md:flex-row flex-col-reverse m-0 w-full">
        <div class="bg-green-950/10 flex md:w-7/10 min-h-screen md:min-h-auto md:mx-5 my-3 p-2 md:p-3 max-w-full">
            <p id="ascii-container" class="text-center min-h-full w-full font-mono"></p>
        </div>
        <div class="relative flex-1 flex flex-col max-h-screen text-green-700 min-h-100 bg-green-950/10 mx-4 my-3 md:mr-5 md:my-3
            text-[10px]
            leading-2.5
            tracking-[0.5px]
            whitespace-pre
        ">
            <header class="bg-green-950/30 flex flex-col py-1 w-full h-fit">
                <h1 class="text-3xl text-center w-full">ASCII Camera</h1>
                <p class="w-full text-xl text-center">Arachoxs</p>
            </header>

            <section class="flex flex-col mt-3 w-full flex-1">
                <div class="flex justify-around w-full flex-wrap mt-0 px-2 gap-4">
                    <button id="camera-trigger" class="flex-1 h-20 justify-center items-center border-4 cursor-pointer border-green-950/30">
                        <p class="text-lg">Use Camera</p>
                    </button>

                    <button id="media-trigger" class="flex-1 h-20 justify-center items-center border-4 cursor-pointer border-green-950/30">
                        <p class="text-lg">Use Image</p>
                    </button>
                </div>

                <form class="flex flex-col mt-4 text-xl gap-1 px-4" id="style-form">
                    <div class="flex gap-2">
                        <label>Font\Size></label>
                        <input class="w-full" name="fontSize" type="number" id="font-size-input" class="w-full" placeholder="px"/>
                    </div>
                    <div class="flex gap-2">
                        <label>Font\letterSpacing></label>
                        <input class="w-full " name="letterSpacing" type="number" id="letter-spacing-input" class="w-full" placeholder="px"/>
                    </div>
                    <div class="flex gap-2">
                        <label>Font\lineHeight></label>
                        <input class="w-full " name="lineHeight" min="1" type="number" id="line-height-input" class="w-full" placeholder="px"/>
                    </div>

                    <button type="submit" class="flex mt-4 h-12 justify-center items-center border-4 cursor-pointer border-green-950/30">
                        <p class="text-lg">Apply Style</p>
                    </button>
                </form>
            </section>
            
        </div>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
